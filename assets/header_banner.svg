<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Blue Glow -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="hudRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .mark-heading { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 22px; fill: #38bdf8; letter-spacing: 6px; }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 58px; fill: url(#titleGrad); letter-spacing: 6px; }
    .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 18px; fill: #94a3b8; letter-spacing: 2px; }
    .tagline-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 14px; fill: #38bdf8; }
    .badge-text { font-family: monospace; font-size: 12px; fill: #00f2fe; font-weight: bold; }
    
    /* Animations */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .rotate-cw { transform-origin: 160px 160px; animation: spinClockwise 25s linear infinite; }
    .rotate-ccw { transform-origin: 160px 160px; animation: spinCounter 18s linear infinite; }
    .rotate-fast { transform-origin: 160px 160px; animation: spinClockwise 10s linear infinite; }
    .pulse { animation: pulseGlow 3s ease-in-out infinite; }
    .blink { animation: blinkDot 1.5s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" class="bg"/>

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="160" cy="160" r="130" fill="#00f2fe" opacity="0.08" filter="url(#glowBlue)"/>
  <circle cx="950" cy="160" r="150" fill="#7f00ff" opacity="0.08" filter="url(#glowBlue)"/>

  <!-- Left Side HUD Holographic Arc Reactor -->
  <g id="hud-arc">
    <!-- Outer Ring -->
    <circle cx="160" cy="160" r="105" fill="none" stroke="url(#hudRingGrad)" stroke-width="2" stroke-dasharray="12 8" class="rotate-cw"/>
    <!-- Inner Segmented Ring -->
    <circle cx="160" cy="160" r="88" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="40 15 10 15" opacity="0.7" class="rotate-ccw"/>
    <!-- Tech Crosshairs -->
    <line x1="160" y1="40" x2="160" y2="280" stroke="#00f2fe" stroke-width="1" opacity="0.25"/>
    <line x1="40" y1="160" x2="280" y2="160" stroke="#00f2fe" stroke-width="1" opacity="0.25"/>
    <!-- Center Core Nodes -->
    <circle cx="160" cy="160" r="55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" class="rotate-fast"/>
    <circle cx="160" cy="160" r="38" fill="#00f2fe" opacity="0.15" filter="url(#glowCyan)" class="pulse"/>
    <circle cx="160" cy="160" r="18" fill="#00e5ff" filter="url(#glowCyan)"/>

    <!-- Orbiting Satellite Nodes -->
    <g class="rotate-cw">
      <circle cx="160" cy="55" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
      <circle cx="265" cy="160" r="4" fill="#ffb347" filter="url(#glowCyan)"/>
      <circle cx="160" cy="265" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
      <circle cx="55" cy="160" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>
    </g>
  </g>

  <!-- Center Text Content -->
  <g transform="translate(320, 0)">
    <!-- Version Pill -->
    <g transform="translate(0, 42)">
      <rect width="175" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#00f2fe" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#00f2fe" class="blink"/>
      <text x="30" y="19" class="badge-text">MARK 20 • F.R.I.D.A.Y</text>
    </g>

    <!-- Category Heading -->
    <text x="0" y="100" class="mark-heading">MARK 20</text>

    <!-- Main Title -->
    <text x="0" y="156" class="title-text" filter="url(#glowCyan)">F.R.I.D.A.Y</text>

    <!-- Subtitle -->
    <text x="0" y="192" class="sub-text">THE ULTIMATE CROSS-PLATFORM PERSONAL VOICE AI</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 2: EDITH Shield -->
      <g transform="translate(0, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#fef3c7" font-weight="600">🛡️ EDITH Security L4</text>
      </g>
      <!-- Badge 3: Dev Agent -->
      <g transform="translate(165, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#d1fae5" font-weight="600">🤖 Dev Agent Engine</text>
      </g>
      <!-- Badge 4: Encrypted HUD -->
      <g transform="translate(330, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#ede9fe" font-weight="600">📱 Mobile Web HUD</text>
      </g>
      <!-- Badge 5: 3D HUD Avatar -->
      <g transform="translate(495, 0)">
        <rect width="160" height="32" rx="8" fill="#1e293b" stroke="#00f2fe" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#e0f9ff" font-weight="600">🧑‍🎤 3D HUD Avatar</text>
      </g>
    </g>
  </g>

  <!-- Right Side Decorative Tech Lines -->
  <g opacity="0.4">
    <line x1="1140" y1="40" x2="1140" y2="280" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="1140" cy="40" r="4" fill="#00f2fe"/>
    <circle cx="1140" cy="280" r="4" fill="#00f2fe"/>
  </g>
</svg>
