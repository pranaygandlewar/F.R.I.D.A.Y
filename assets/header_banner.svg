<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Cyan Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Purple/Blue Glow -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ffcc33"/>
    </linearGradient>

    <linearGradient id="hudRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7f00ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <style>
    .bg { fill: url(#bgGrad); }
    .title-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 54px; fill: url(#titleGrad); letter-spacing: 4px; }
    .sub-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 20px; fill: #94a3b8; letter-spacing: 2px; }
    .tagline-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 15px; fill: #38bdf8; }
    .badge-text { font-family: monospace; font-size: 12px; fill: #00f2fe; font-weight: bold; }
    
    /* Animations */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-360deg); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }
    @keyframes waveMotion {
      0% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.1); }
      100% { transform: scaleY(0.3); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(400px); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .rotate-cw { transform-origin: 160px 170px; animation: spinClockwise 25s linear infinite; }
    .rotate-ccw { transform-origin: 160px 170px; animation: spinCounter 18s linear infinite; }
    .rotate-fast { transform-origin: 160px 170px; animation: spinClockwise 10s linear infinite; }
    .pulse { animation: pulseGlow 3s ease-in-out infinite; }
    .blink { animation: blinkDot 1.5s ease-in-out infinite; }

    .wave-bar { transform-origin: bottom; animation: waveMotion 1.2s ease-in-out infinite; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="340" rx="16" class="bg"/>

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#00f2fe" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" />
    <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340 M600 0 V340 M700 0 V340 M800 0 V340 M900 0 V340 M1000 0 V340 M1100 0 V340" />
  </g>

  <!-- Glowing Background Orbs -->
  <circle cx="160" cy="170" r="130" fill="#00f2fe" opacity="0.08" filter="url(#glowBlue)"/>
  <circle cx="950" cy="170" r="150" fill="#7f00ff" opacity="0.08" filter="url(#glowBlue)"/>

  <!-- Left Side HUD Holographic Arc Reactor (Interactive Visual) -->
  <g id="hud-arc">
    <!-- Outer Ring -->
    <circle cx="160" cy="170" r="105" fill="none" stroke="url(#hudRingGrad)" stroke-width="2" stroke-dasharray="12 8" class="rotate-cw"/>
    <!-- Inner Segmented Ring -->
    <circle cx="160" cy="170" r="88" fill="none" stroke="#00f2fe" stroke-width="3" stroke-dasharray="40 15 10 15" opacity="0.7" class="rotate-ccw"/>
    <!-- Tech Crosshairs -->
    <line x1="160" y1="50" x2="160" y2="290" stroke="#00f2fe" stroke-width="1" opacity="0.25"/>
    <line x1="40" y1="170" x2="280" y2="170" stroke="#00f2fe" stroke-width="1" opacity="0.25"/>
    <!-- Center Core Nodes -->
    <circle cx="160" cy="170" r="55" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" class="rotate-fast"/>
    <circle cx="160" cy="170" r="38" fill="#00f2fe" opacity="0.15" filter="url(#glowCyan)" class="pulse"/>
    <circle cx="160" cy="170" r="18" fill="#00e5ff" filter="url(#glowCyan)"/>

    <!-- Orbiting Satellite Nodes -->
    <g class="rotate-cw">
      <circle cx="160" cy="65" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
      <circle cx="265" cy="170" r="4" fill="#ffb347" filter="url(#glowCyan)"/>
      <circle cx="160" cy="275" r="4" fill="#00f2fe" filter="url(#glowCyan)"/>
      <circle cx="55" cy="170" r="4" fill="#38bdf8" filter="url(#glowCyan)"/>
    </g>
  </g>

  <!-- Center Text Content -->
  <g transform="translate(320, 0)">
    <!-- Version Pill -->
    <g transform="translate(0, 50)">
      <rect width="170" height="28" rx="14" fill="#0369a1" fill-opacity="0.3" stroke="#00f2fe" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#00f2fe" class="blink"/>
      <text x="30" y="19" class="badge-text">MARK 20 • LV (55)</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text" filter="url(#glowCyan)">MARK 20</text>

    <!-- Subtitle -->
    <text x="0" y="168" class="sub-text">THE ULTIMATE CROSS-PLATFORM PERSONAL VOICE AI</text>

    <!-- Tagline -->
    <text x="0" y="200" class="tagline-text">Holographic Avatar • 9-Model Ladder • EDITH Security • Autonomous Dev Agent • Mobile Web HUD</text>

    <!-- Feature Pill Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1: Gemini Live -->
      <g transform="translate(0, 0)">
        <rect width="145" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#e0f2fe" font-weight="600">🎙️ Gemini Live API</text>
      </g>
      <!-- Badge 2: EDITH Shield -->
      <g transform="translate(155, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#fef3c7" font-weight="600">🛡️ EDITH Security L4</text>
      </g>
      <!-- Badge 3: Dev Agent -->
      <g transform="translate(320, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#d1fae5" font-weight="600">🤖 Dev Agent Engine</text>
      </g>
      <!-- Badge 4: Encrypted HUD -->
      <g transform="translate(485, 0)">
        <rect width="155" height="32" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
        <text x="14" y="21" font-family="Segoe UI, sans-serif" font-size="13" fill="#ede9fe" font-weight="600">📱 Mobile Web HUD</text>
      </g>
    </g>

    <!-- Bottom Audio Equalizer Animation -->
    <g transform="translate(0, 290)">
      <text x="0" y="-8" font-family="monospace" font-size="11" fill="#64748b">LIVE AUDIO SPECTRUM &amp; VISEME SYNCHRONIZER</text>
      <g transform="translate(280, -18)">
        <rect x="0" y="0" width="4" height="20" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.1s"/>
        <rect x="8" y="0" width="4" height="20" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.4s"/>
        <rect x="16" y="0" width="4" height="20" fill="#818cf8" class="wave-bar" style="animation-delay: 0.2s"/>
        <rect x="24" y="0" width="4" height="20" fill="#c084fc" class="wave-bar" style="animation-delay: 0.6s"/>
        <rect x="32" y="0" width="4" height="20" fill="#38bdf8" class="wave-bar" style="animation-delay: 0.3s"/>
        <rect x="40" y="0" width="4" height="20" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.5s"/>
        <rect x="48" y="0" width="4" height="20" fill="#f43f5e" class="wave-bar" style="animation-delay: 0.15s"/>
        <rect x="56" y="0" width="4" height="20" fill="#fbbf24" class="wave-bar" style="animation-delay: 0.45s"/>
        <rect x="64" y="0" width="4" height="20" fill="#10b981" class="wave-bar" style="animation-delay: 0.25s"/>
        <rect x="72" y="0" width="4" height="20" fill="#00f2fe" class="wave-bar" style="animation-delay: 0.35s"/>
      </g>
    </g>
  </g>

  <!-- Right Side Decorative Tech Lines -->
  <g opacity="0.4">
    <line x1="1140" y1="40" x2="1140" y2="300" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 6"/>
    <circle cx="1140" cy="40" r="4" fill="#00f2fe"/>
    <circle cx="1140" cy="300" r="4" fill="#00f2fe"/>
  </g>
</svg>
