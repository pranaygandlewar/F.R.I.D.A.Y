<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#071527"/>
    </linearGradient>

    <filter id="glowGreenDev" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-dev { fill: url(#bgDev); }
    .head-dev { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #10b981; }
    .sub-dev { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
    .code-text { font-family: 'Cascadia Code', Consolas, monospace; font-size: 12px; fill: #38bdf8; }
    .typing-cursor { fill: #00f2fe; animation: blinkCursor 0.8s infinite; }

    @keyframes blinkCursor {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="1100" height="380" rx="14" class="bg-dev" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" class="head-dev">🤖 AUTONOMOUS DEV AGENT &amp; MISSION PLANNER</text>
    <text x="0" y="24" class="sub-dev">Voice-Driven Project Architecture, Multi-File Generation, Self-Testing &amp; Self-Healing Loop</text>
  </g>

  <!-- Left: Mission Planner Pipeline -->
  <g transform="translate(40, 95)">
    <rect width="480" height="250" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="480" height="36" rx="10" fill="#1e293b"/>
    <text x="20" y="23" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="#60a5fa">📋 MISSION PLANNER PIPELINE</text>

    <!-- Steps -->
    <g transform="translate(20, 55)">
      <circle cx="12" cy="12" r="12" fill="#10b981"/>
      <text x="9" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff">1</text>
      <text x="35" y="16" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Decompose Goal &amp; Audit Risk Levels</text>

      <line x1="12" y1="28" x2="12" y2="48" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>

      <g transform="translate(0, 40)">
        <circle cx="12" cy="12" r="12" fill="#10b981"/>
        <text x="9" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff">2</text>
        <text x="35" y="16" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Generate File Architecture &amp; Schemas</text>
      </g>

      <line x1="12" y1="68" x2="12" y2="88" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3"/>

      <g transform="translate(0, 80)">
        <circle cx="12" cy="12" r="12" fill="#3b82f6"/>
        <text x="9" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff">3</text>
        <text x="35" y="16" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Execute Build &amp; Run Test Suites</text>
      </g>

      <line x1="12" y1="108" x2="12" y2="128" stroke="#3b82f6" stroke-width="2" stroke-dasharray="3 3"/>

      <g transform="translate(0, 120)">
        <circle cx="12" cy="12" r="12" fill="#8b5cf6"/>
        <text x="9" y="16" font-family="monospace" font-weight="700" font-size="11" fill="#ffffff">4</text>
        <text x="35" y="16" font-family="Segoe UI, sans-serif" font-weight="600" font-size="13" fill="#f8fafc">Inspect Traceback &amp; Self-Heal (Up to 5x)</text>
      </g>
    </g>

    <rect x="20" y="200" width="440" height="30" rx="6" fill="#064e3b"/>
    <text x="35" y="220" font-family="monospace" font-size="12" fill="#34d399">STATUS: Project Build Complete — 0 Errors</text>
  </g>

  <!-- Right: Simulated Live Terminal -->
  <g transform="translate(540, 95)">
    <rect width="520" height="250" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="520" height="30" rx="10" fill="#0f172a"/>
    <circle cx="18" cy="15" r="5" fill="#ef4444"/>
    <circle cx="34" cy="15" r="5" fill="#f59e0b"/>
    <circle cx="50" cy="15" r="5" fill="#10b981"/>
    <text x="70" y="19" font-family="monospace" font-size="11" fill="#64748b">dev_agent.py — Interactive Execution Terminal</text>

    <!-- Terminal Lines -->
    <g transform="translate(20, 50)">
      <text x="0" y="0" class="code-text" fill="#a7f3d0">$ friday "Build a full-stack weather dashboard in React"</text>
      <text x="0" y="22" class="code-text" fill="#94a3b8">[+] Dev Agent initialized. Workspace: ~/Desktop/FridayProjects/WeatherApp</text>
      <text x="0" y="44" class="code-text" fill="#38bdf8">[+] Creating src/App.jsx, src/components/WeatherCard.jsx, package.json</text>
      <text x="0" y="66" class="code-text" fill="#fcd34d">[!] npm run test → Failed: TypeError on line 42 in WeatherCard.jsx</text>
      <text x="0" y="88" class="code-text" fill="#c084fc">[🧠] Self-Healing: Inspecting traceback &amp; patching props...</text>
      <text x="0" y="110" class="code-text" fill="#34d399">[+] Re-running tests → PASS (14 tests passed, 0.42s)</text>
      <text x="0" y="132" class="code-text" fill="#60a5fa">[🚀] App compiled successfully! Server running at http://localhost:3000</text>
      <text x="0" y="154" class="code-text" fill="#00f2fe">&gt; Friday: "Your React weather dashboard is ready on your desktop!"</text>
      <rect x="425" y="142" width="8" height="15" class="typing-cursor"/>
    </g>
  </g>
</svg>
