<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLadder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowYellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-ladder { fill: url(#bgGradLadder); }
    .heading { font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 800; font-size: 24px; fill: #00f2fe; }
    .subhead { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; fill: #94a3b8; }
    .model-title { font-family: monospace; font-weight: 700; font-size: 15px; fill: #f8fafc; }
    .model-speed { font-family: monospace; font-size: 13px; font-weight: 600; }
    .model-desc { font-family: 'Segoe UI', sans-serif; font-size: 12px; fill: #94a3b8; }

    @keyframes pulseActive {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
    @keyframes flowArrow {
      0% { stroke-dashoffset: 20; }
      100% { stroke-dashoffset: 0; }
    }
    .active-dot { animation: pulseActive 1.2s infinite; }
    .flowing-line { stroke-dasharray: 6 6; animation: flowArrow 1s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1100" height="440" rx="14" class="bg-ladder" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Section -->
  <g transform="translate(40, 45)">
    <text x="0" y="0" class="heading">🪜 THE 9-TIER GEMINI MODEL RESILIENCE LADDER</text>
    <text x="0" y="24" class="subhead">Measured latency, zero-hang timeouts (10s), and automatic exponential cooldowns on quota / outages</text>
  </g>

  <!-- Rung Grid (2 columns: Top Tier & Fallbacks) -->
  
  <!-- Column 1: Fast Rungs (1 to 5) -->
  <g transform="translate(40, 100)">
    <!-- Rung 1 -->
    <g transform="translate(0, 0)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
      <circle cx="25" cy="26" r="6" fill="#10b981" filter="url(#glowGreen)" class="active-dot"/>
      <text x="45" y="24" class="model-title">1. gemini-3.5-flash-lite</text>
      <text x="45" y="41" class="model-desc">Tier 1 Primary • Measured Response: 0.56s</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#064e3b"/>
      <text x="403" y="30" class="model-speed" fill="#34d399">0.56s ⚡</text>
    </g>

    <!-- Rung 2 -->
    <g transform="translate(0, 62)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#3b82f6"/>
      <text x="45" y="24" class="model-title">2. gemini-3.1-flash-lite</text>
      <text x="45" y="41" class="model-desc">Tier 2 Standby • Measured Response: 0.60s</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#1e3a8a"/>
      <text x="403" y="30" class="model-speed" fill="#60a5fa">0.60s ⚡</text>
    </g>

    <!-- Rung 3 -->
    <g transform="translate(0, 124)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#3b82f6"/>
      <text x="45" y="24" class="model-title">3. gemini-flash-lite-latest</text>
      <text x="45" y="41" class="model-desc">Tier 3 Standby • Measured Response: 0.60s</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#1e3a8a"/>
      <text x="403" y="30" class="model-speed" fill="#60a5fa">0.60s ⚡</text>
    </g>

    <!-- Rung 4 -->
    <g transform="translate(0, 186)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#3b82f6"/>
      <text x="45" y="24" class="model-title">4. gemini-2.5-flash</text>
      <text x="45" y="41" class="model-desc">Tier 4 Mid-Range • Measured Response: 0.67s</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#1e3a8a"/>
      <text x="403" y="30" class="model-speed" fill="#60a5fa">0.67s ⚡</text>
    </g>

    <!-- Rung 5 -->
    <g transform="translate(0, 248)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#3b82f6"/>
      <text x="45" y="24" class="model-title">5. gemini-2.5-flash-lite</text>
      <text x="45" y="41" class="model-desc">Tier 5 Mid-Range • Measured Response: 0.74s</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#1e3a8a"/>
      <text x="403" y="30" class="model-speed" fill="#60a5fa">0.74s ⚡</text>
    </g>
  </g>

  <!-- Column 2: Reasoning & Extended Fallbacks (6 to 9 + Cooldown Policy) -->
  <g transform="translate(560, 100)">
    <!-- Rung 6 -->
    <g transform="translate(0, 0)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#8b5cf6"/>
      <text x="45" y="24" class="model-title">6. gemini-3.5-flash</text>
      <text x="45" y="41" class="model-desc">Tier 6 Reasoning • Measured Response: 1.13s</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#4c1d95"/>
      <text x="403" y="30" class="model-speed" fill="#c084fc">1.13s 🧠</text>
    </g>

    <!-- Rung 7 -->
    <g transform="translate(0, 62)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#f59e0b"/>
      <text x="45" y="24" class="model-title">7. gemini-3-flash-preview</text>
      <text x="45" y="41" class="model-desc">Tier 7 Backup • Automatic 10s Deadline Guard</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#78350f"/>
      <text x="400" y="30" class="model-speed" fill="#fcd34d">504 Drop</text>
    </g>

    <!-- Rung 8 -->
    <g transform="translate(0, 124)">
      <rect width="490" height="52" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1"/>
      <circle cx="25" cy="26" r="6" fill="#ef4444"/>
      <text x="45" y="24" class="model-title">8. gemini-3.6-flash</text>
      <text x="45" y="41" class="model-desc">Tier 8 High Capacity • Timeout Cooldown Managed</text>
      <rect x="390" y="14" width="85" height="24" rx="6" fill="#7f1d1d"/>
      <text x="400" y="30" class="model-speed" fill="#fca5a5">Cooldown</text>
    </g>

    <!-- Cooldown Policy Banner -->
    <g transform="translate(0, 186)">
      <rect width="490" height="114" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="20" y="26" font-family="Segoe UI, sans-serif" font-weight="700" font-size="14" fill="#a5b4fc">⏱️ AUTOMATIC COOLDOWN CIRCUIT BREAKER</text>
      <text x="20" y="48" font-family="monospace" font-size="12" fill="#e0e7ff">• Quota Exceeded (429): Cooled for 5 Minutes</text>
      <text x="20" y="68" font-family="monospace" font-size="12" fill="#e0e7ff">• Outage / Timeout (503/504): Cooled for 30 Minutes</text>
      <text x="20" y="88" font-family="monospace" font-size="12" fill="#e0e7ff">• Not Found / Access Denied (404): Cooled for 6 Hours</text>
      <text x="20" y="104" font-family="Segoe UI, sans-serif" font-size="11" fill="#818cf8" font-style="italic">→ Saves 11.2 seconds on every subsequent API call during outages</text>
    </g>
  </g>
</svg>
